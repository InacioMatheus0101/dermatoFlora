<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sol-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F5E8C7"/>
    </radialGradient>
    <radialGradient id="sol-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(215, 120, 20, 0.28)"/>
      <stop offset="70%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="sun-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="bronze-bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D5B29"/>
      <stop offset="35%" stop-color="#C28646"/>
      <stop offset="70%" stop-color="#E0A768"/>
      <stop offset="100%" stop-color="#6E4319"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#sol-bg)"/>

  <!-- Sol Brilhante Estilizado no Fundo -->
  <g transform="translate(200, 110)" opacity="0.18">
    <circle r="60" fill="url(#sun-gold)"/>
    <g stroke="#FB8C00" stroke-width="3" stroke-linecap="round">
      <line y1="-75" y2="-90"/>
      <line y1="75" y2="90"/>
      <line x1="-75" x2="-90"/>
      <line x1="75" x2="90"/>
      <line x1="-55" y1="-55" x2="-65" y2="-65"/>
      <line x1="55" y1="55" x2="65" y2="65"/>
      <line x1="-55" y1="55" x2="-65" y2="65"/>
      <line x1="55" y1="-55" x2="65" y2="-65"/>
    </g>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="200" cy="345" rx="145" ry="18" fill="url(#sol-shadow)"/>

  <!-- ================= ITEM 1: CAMISA COM PROTEÇÃO UVA +50 FPS (CENTRO/FUNDO) ================= -->
  <g transform="translate(130, 95)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.12))">
    <!-- Camisa UV Manga Longa Dobrada Elegante -->
    <path d="M40 25 C55 40 85 40 100 25 L125 45 L115 150 L25 150 L15 45 Z" fill="#14471D"/>
    <!-- Gola da Camisa -->
    <path d="M40 25 C55 38 85 38 100 25 C88 50 52 50 40 25 Z" fill="#247833"/>
    <!-- Logo DermatoFlora Peito -->
    <circle cx="55" cy="70" r="7" fill="#E2541C"/>
    <text x="66" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF">Dermato<tspan fill="#55E072">Flora</tspan></text>
    
    <!-- Tag UV +50 na Camisa -->
    <rect x="45" y="90" width="50" height="20" rx="4" fill="#FFFFFF"/>
    <text x="70" y="103" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#E2541C">UVA +50</text>
    <text x="70" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" fill="#B5D1BA">Todos os Tamanhos</text>
  </g>

  <!-- ================= ITEM 2: BLOQUEADOR SOLAR (ESQUERDA) ================= -->
  <g transform="translate(50, 160)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.15))">
    <!-- Bisnaga Bloqueador Branco Fosco -->
    <path d="M25 50 C25 20 75 20 75 50 L70 140 L30 140 Z" fill="#FFFFFF" stroke="#E2EDE3" stroke-width="1.5"/>
    <rect x="33" y="140" width="34" height="24" rx="4" fill="#E2541C"/>
    <!-- Detalhes do Rótulo -->
    <rect x="27" y="55" width="46" height="70" rx="4" fill="#FAFDF9"/>
    <circle cx="50" cy="72" r="10" fill="#FFA726"/>
    <text x="50" y="75" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">FPS</text>
    <text x="50" y="94" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#14471D">BLOQUEADOR</text>
    <text x="50" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#E2541C">SOLAR</text>
    <text x="50" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" font-weight="600" fill="#666">Alta Proteção</text>
  </g>

  <!-- ================= ITEM 3: BRONZEADOR COM FPS (DIREITA) ================= -->
  <g transform="translate(270, 170)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.18))">
    <!-- Frasco Spray Bronze Dourado -->
    <rect x="25" y="45" width="50" height="100" rx="8" fill="url(#bronze-bottle)"/>
    <rect x="42" y="30" width="16" height="15" fill="#4A2E12"/>
    <path d="M38 24 L62 24 L62 30 L38 30 Z" fill="#1A1A1A"/>
    <rect x="58" y="22" width="6" height="5" fill="#1A1A1A"/>
    <!-- Rótulo Bronzeador -->
    <rect x="28" y="60" width="44" height="65" rx="4" fill="#FFFFFF"/>
    <text x="50" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#247833">DermatoFlora</text>
    <text x="50" y="88" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="700" fill="#8D5B29">BRONZEADOR</text>
    <rect x="36" y="93" width="28" height="10" rx="5" fill="#FF8F00"/>
    <text x="50" y="100.5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#FFFFFF">COM FPS</text>
    <text x="50" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" font-weight="600" fill="#666">Tom Dourado</text>
  </g>

  <!-- Badge Flutuante "Linha Solar Completa" -->
  <g transform="translate(110, 45)">
    <rect width="180" height="32" rx="16" fill="#E65100" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
    <circle cx="16" cy="16" r="8" fill="#FFE082"/>
    <path d="M13 16 L15 18 L19 14" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="32" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">Bloqueador • Camisa UV • Bronze</text>
  </g>
</svg>

