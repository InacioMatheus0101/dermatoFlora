<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="veno-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#DFE7ED"/>
    </radialGradient>
    <radialGradient id="veno-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(24, 76, 120, 0.25)"/>
      <stop offset="70%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="veno-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D7E"/>
      <stop offset="50%" stop-color="#11365A"/>
      <stop offset="100%" stop-color="#0A233D"/>
    </linearGradient>
    <linearGradient id="leg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28B65"/>
      <stop offset="50%" stop-color="#E5B28F"/>
      <stop offset="100%" stop-color="#BE855F"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#veno-bg)"/>

  <!-- Sombra no solo -->
  <ellipse cx="200" cy="345" rx="130" ry="20" fill="url(#veno-shadow)"/>

  <!-- Caixa Oficial Venosan 6000 (Inclinada com Perspectiva) -->
  <g transform="translate(60, 90)">
    <!-- Caixa -->
    <rect x="30" y="30" width="160" height="220" rx="12" fill="url(#veno-box)" filter="drop-shadow(0 14px 25px rgba(0,0,0,0.22))"/>
    
    <!-- Topo da Caixa Venosan -->
    <rect x="30" y="30" width="160" height="45" rx="12" fill="#0C2540"/>
    <text x="110" y="58" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="2">VENOSAN®</text>
    
    <!-- Modelo 6000 -->
    <text x="110" y="105" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="900" fill="#E2541C">6000</text>
    <text x="110" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">MEIA COXA (AG)</text>
    <rect x="65" y="135" width="90" height="18" rx="9" fill="#14471D"/>
    <text x="110" y="147" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#55E072">COMPRESSÃO GRADUADA</text>

    <!-- Linhas de indicação -->
    <text x="110" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#B0C8E0">• Varizes &amp; Edema Leve</text>
    <text x="110" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#B0C8E0">• Prevenção na Gestação</text>
    <text x="110" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#B0C8E0">• Pós-Cirúrgico Venoso</text>

    <!-- Rodapé da Caixa com Selo DermatoFlora -->
    <rect x="30" y="222" width="160" height="28" rx="8" fill="#FFFFFF"/>
    <text x="110" y="239" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#14471D">Disponível na DermatoFlora</text>
  </g>

  <!-- Silhueta da Meia de Compressão Macia ao lado -->
  <g transform="translate(240, 110)">
    <!-- Meia Coxa com banda de silicone rendada no topo -->
    <path d="M40 20 C55 20 70 24 75 35 C78 50 72 90 70 130 C68 165 72 185 75 200 C78 212 85 220 70 225 C50 230 40 225 35 220 C25 210 28 175 30 140 C32 100 28 50 32 30 C34 22 36 20 40 20 Z" fill="url(#leg-grad)" opacity="0.95" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.18))"/>
    
    <!-- Faixa de silicone rendada no topo da meia coxa -->
    <rect x="30" y="20" width="48" height="18" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="36" cy="29" r="2.5" fill="#C28B65"/>
    <circle cx="44" cy="29" r="2.5" fill="#C28B65"/>
    <circle cx="52" cy="29" r="2.5" fill="#C28B65"/>
    <circle cx="60" cy="29" r="2.5" fill="#C28B65"/>
    <circle cx="68" cy="29" r="2.5" fill="#C28B65"/>

    <!-- Linhas de gradiente de compressão -->
    <path d="M30 60 Q54 64 72 60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M29 100 Q54 104 70 100" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M30 150 Q54 154 72 150" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M32 190 Q54 194 75 190" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" fill="none"/>
  </g>

  <!-- Badge Flutuante "Saúde Vascular" -->
  <g transform="translate(240, 60)">
    <rect width="130" height="32" rx="16" fill="#1B4D7E" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
    <circle cx="16" cy="16" r="8" fill="#55E072"/>
    <path d="M13 16 L15 18 L19 14" stroke="#1B4D7E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="30" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">Saúde Vascular</text>
  </g>
</svg>

