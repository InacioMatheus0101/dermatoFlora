<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2F8F3"/>
      <stop offset="100%" stop-color="#E1EFE3"/>
    </radialGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="50%" stop-color="#1E461A"/>
      <stop offset="100%" stop-color="#143411"/>
    </linearGradient>
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="50%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#D68910"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14471D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo Circular Suave -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)"/>
  
  <!-- Sombra de Base -->
  <ellipse cx="200" cy="335" rx="90" ry="14" fill="#000000" opacity="0.12"/>

  <!-- Pote de Vidro Farmacêutico Milho de Urubu -->
  <g filter="url(#shadow)">
    <!-- Corpo do Pote -->
    <rect x="125" y="150" width="150" height="170" rx="28" fill="url(#jarGlass)"/>
    
    <!-- Tampa Dourada Farmacêutica -->
    <rect x="135" y="115" width="130" height="40" rx="8" fill="url(#capGold)"/>
    <!-- Frisos da Tampa -->
    <line x1="145" y1="125" x2="145" y2="145" stroke="#B7770D" stroke-width="2"/>
    <line x1="165" y1="125" x2="165" y2="145" stroke="#B7770D" stroke-width="2"/>
    <line x1="185" y1="125" x2="185" y2="145" stroke="#B7770D" stroke-width="2"/>
    <line x1="205" y1="125" x2="205" y2="145" stroke="#B7770D" stroke-width="2"/>
    <line x1="225" y1="125" x2="225" y2="145" stroke="#B7770D" stroke-width="2"/>
    <line x1="245" y1="125" x2="245" y2="145" stroke="#B7770D" stroke-width="2"/>

    <!-- Rótulo Frontal -->
    <rect x="138" y="170" width="124" height="125" rx="10" fill="#FFFFFF"/>
    
    <!-- Faixa Verde no Rótulo -->
    <rect x="138" y="180" width="124" height="24" fill="#247833"/>
    <text x="200" y="196" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DERMATOFLORA</text>
    
    <!-- Ícone Botânico Central -->
    <circle cx="200" cy="226" r="16" fill="#F4FBF5"/>
    <path d="M200 215 C192 224, 192 233, 200 237 C208 233, 208 224, 200 215 Z" fill="#247833"/>
    <path d="M195 228 C188 228, 186 222, 195 221" stroke="#E2541C" stroke-width="1.5" fill="none"/>
    
    <!-- Título do Produto no Rótulo -->
    <text x="200" y="258" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#E2541C" text-anchor="middle">MILHO DE URUBU</text>
    <text x="200" y="271" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#14471D" text-anchor="middle">Fórmula Pele &amp; Psoríase</text>
    <text x="200" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#7E8D7F" text-anchor="middle">Pomada Magistral 60g</text>

    <!-- Brilho no Vidro -->
    <path d="M135 160 Q138 230 140 310" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.3" fill="none"/>
  </g>

  <!-- Selo de Ativo Natural Tradicional -->
  <g transform="translate(275, 120)">
    <circle cx="20" cy="20" r="28" fill="#E2541C"/>
    <circle cx="20" cy="20" r="25" fill="#E2541C" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="20" y="16" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">100%</text>
    <text x="20" y="26" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">NATURAL</text>
  </g>
</svg>

