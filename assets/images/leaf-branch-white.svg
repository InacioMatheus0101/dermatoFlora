<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" fill="none">
  <defs>
    <filter id="leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#leaf-glow)">
    <!-- Haste Principal Curvada (Começa no canto inferior esquerdo e sobe elegante) -->
    <path d="M 0 360 C 60 320, 100 240, 160 110" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <!-- ==================== FOLHA 1 (Inferior / Esquerda) ==================== -->
    <!-- Contorno da Folha -->
    <path d="M 80 270 C 25 285, 2 245, 10 215 C 38 215, 68 235, 80 270 Z" 
          fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="3.8" stroke-linejoin="round" />
    <!-- Nervura Central -->
    <path d="M 80 270 Q 42 242 10 215" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- ==================== FOLHA 2 (Média / Superior Esquerda) ==================== -->
    <!-- Contorno da Folha -->
    <path d="M 125 185 C 80 190, 50 150, 68 115 C 105 120, 120 150, 125 185 Z" 
          fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="3.8" stroke-linejoin="round" />
    <!-- Nervura Central -->
    <path d="M 125 185 Q 92 152 68 115" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- ==================== FOLHA 3 (Ápice / Superior Direita) ==================== -->
    <!-- Contorno da Folha -->
    <path d="M 160 110 C 170 50, 220 25, 250 40 C 240 85, 195 105, 160 110 Z" 
          fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="3.8" stroke-linejoin="round" />
    <!-- Nervura Central -->
    <path d="M 160 110 Q 210 75 250 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
