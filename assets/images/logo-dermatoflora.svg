<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" fill="none">
  <defs>
    <linearGradient id="df-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A3D" />
      <stop offset="100%" stop-color="#E2541C" />
    </linearGradient>
    <linearGradient id="df-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#247833" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(6, 6)" filter="url(#soft-shadow)">
    <!-- Base Circular Emblem -->
    <!-- Orange lower-right arc -->
    <path d="M 36 6 A 30 30 0 0 1 64 48 A 30 30 0 0 1 36 66 L 36 36 Z" fill="url(#df-orange-grad)" />
    <!-- Green upper-left arc -->
    <path d="M 36 6 A 30 30 0 0 0 8 36 A 30 30 0 0 0 36 66 L 36 36 Z" fill="url(#df-green-grad)" />

    <!-- Rotated White Pill Capsule Container -->
    <g transform="rotate(-35 36 36)">
      <!-- Capsule Body -->
      <rect x="22" y="14" width="28" height="44" rx="14" fill="#FFFFFF" stroke="#FAF8F5" stroke-width="1.5" />
      <!-- Top Half Green fill -->
      <path d="M 22 28 C 22 20 28 14 36 14 C 44 14 50 20 50 28 L 50 36 L 22 36 Z" fill="#2E7D32" />
      <!-- Two Stylized Natural Leaves inside/crossing -->
      <!-- Leaf 1 (Left White Leaf) -->
      <path d="M 36 36 C 26 32 26 22 36 22 C 38 27 38 33 36 36 Z" fill="#FFFFFF" />
      <!-- Leaf 2 (Right White Leaf) -->
      <path d="M 36 36 C 44 32 46 22 38 20 C 34 26 34 32 36 36 Z" fill="#A5D6A7" />
    </g>
  </g>

  <!-- Typography Group -->
  <!-- "Dermato" in vibrant Orange -->
  <text x="88" y="47" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="32" fill="#E2541C" letter-spacing="-0.5">Dermato</text>
  <!-- "Flora" in deep Green -->
  <text x="227" y="47" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="32" fill="#247833" letter-spacing="-0.5">Flora</text>
  
  <!-- Subtitle: "FARMÁCIA DE MANIPULAÇÃO" -->
  <text x="90" y="66" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="600" font-size="10.5" fill="#E2541C" letter-spacing="3.2" opacity="0.9">FARMÁCIA DE MANIPULAÇÃO</text>
</svg>

