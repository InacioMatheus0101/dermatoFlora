<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="flor-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </radialGradient>
    <radialGradient id="flor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(100, 70, 30, 0.25)"/>
      <stop offset="70%" stop-color="transparent"/>
    </radialGradient>
    <!-- Vidro Âmbar Nobre -->
    <linearGradient id="amber-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2E12"/>
      <stop offset="20%" stop-color="#7B4D1E"/>
      <stop offset="50%" stop-color="#A6682B"/>
      <stop offset="80%" stop-color="#7B4D1E"/>
      <stop offset="100%" stop-color="#3D250E"/>
    </linearGradient>
    <!-- Bulbo de Silicone Preto -->
    <linearGradient id="dropper-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#flor-bg)"/>

  <!-- Halo de Cromoterapia Suave de Fundo -->
  <circle cx="200" cy="180" r="130" fill="#FFE0B2" opacity="0.3" filter="blur(30px)"/>
  <circle cx="130" cy="220" r="80" fill="#C8E6C9" opacity="0.35" filter="blur(25px)"/>
  <circle cx="270" cy="220" r="80" fill="#BBDEFB" opacity="0.35" filter="blur(25px)"/>

  <!-- Sombra no solo -->
  <ellipse cx="200" cy="345" rx="145" ry="18" fill="url(#flor-shadow)"/>

  <!-- ================= FRASCO 1: ESQUERDA (FLORAL KIDS) ================= -->
  <g transform="translate(65, 140)">
    <!-- Frasco Âmbar -->
    <rect x="15" y="60" width="60" height="110" rx="10" fill="url(#amber-glass)"/>
    <!-- Ombro e Gargalo -->
    <path d="M25 60 L38 45 L52 45 L65 60 Z" fill="url(#amber-glass)"/>
    <rect x="37" y="32" width="16" height="15" fill="#3D250E"/>
    <!-- Tampa Conta-gotas -->
    <rect x="34" y="24" width="22" height="10" rx="2" fill="url(#dropper-cap)"/>
    <path d="M37 24 C37 10 53 10 53 24 Z" fill="url(#dropper-cap)"/>
    <!-- Rótulo Kids -->
    <rect x="18" y="75" width="54" height="75" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="75" width="54" height="4" fill="#FFA726"/>
    <text x="45" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#247833">DermatoFlora</text>
    <text x="45" y="102" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#E65100">FLORAL</text>
    <text x="45" y="112" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#FB8C00">KIDS 🎈</text>
    <text x="45" y="124" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" fill="#777">Cromoterapia</text>
    <text x="45" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.8" font-weight="500" fill="#999">Infantil</text>
  </g>

  <!-- ================= FRASCO 2: CENTRO (FLORAL ADULTO) ================= -->
  <g transform="translate(160, 110)">
    <!-- Frasco Âmbar Principal (Mais Alto) -->
    <rect x="15" y="65" width="70" height="135" rx="12" fill="url(#amber-glass)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.2))"/>
    <!-- Ombro e Gargalo -->
    <path d="M26 65 L41 48 L59 48 L74 65 Z" fill="url(#amber-glass)"/>
    <rect x="41" y="32" width="18" height="18" fill="#3D250E"/>
    <!-- Tampa Conta-gotas -->
    <rect x="38" y="24" width="24" height="12" rx="2" fill="url(#dropper-cap)"/>
    <path d="M41 24 C41 8 59 8 59 24 Z" fill="url(#dropper-cap)"/>
    <!-- Rótulo Adulto -->
    <rect x="19" y="82" width="62" height="92" rx="5" fill="#FFFFFF"/>
    <rect x="19" y="82" width="62" height="4" fill="#247833"/>
    <text x="50" y="97" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#247833">DermatoFlora</text>
    <text x="50" y="114" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#14471D">FLORAL</text>
    <text x="50" y="126" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#247833">ADULTO</text>
    <rect x="30" y="133" width="40" height="12" rx="6" fill="#E8F5E9"/>
    <text x="50" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="700" fill="#247833">CROMOTERAPIA</text>
    <text x="50" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="600" fill="#666">Harmonização</text>
    <text x="50" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="500" fill="#888">30 ml</text>
  </g>

  <!-- ================= FRASCO 3: DIREITA (FLORAL PET) ================= -->
  <g transform="translate(265, 140)">
    <!-- Frasco Âmbar -->
    <rect x="15" y="60" width="60" height="110" rx="10" fill="url(#amber-glass)"/>
    <!-- Ombro e Gargalo -->
    <path d="M25 60 L38 45 L52 45 L65 60 Z" fill="url(#amber-glass)"/>
    <rect x="37" y="32" width="16" height="15" fill="#3D250E"/>
    <!-- Tampa Conta-gotas -->
    <rect x="34" y="24" width="22" height="10" rx="2" fill="url(#dropper-cap)"/>
    <path d="M37 24 C37 10 53 10 53 24 Z" fill="url(#dropper-cap)"/>
    <!-- Rótulo PET -->
    <rect x="18" y="75" width="54" height="75" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="75" width="54" height="4" fill="#E2541C"/>
    <text x="45" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#247833">DermatoFlora</text>
    <text x="45" y="102" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#BF360C">FLORAL</text>
    <text x="45" y="112" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#E2541C">PET 🐾</text>
    <text x="45" y="124" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" fill="#777">Cromoterapia</text>
    <text x="45" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.8" font-weight="500" fill="#999">Veterinário</text>
  </g>

  <!-- Badge Flutuante "Terapia Floral" -->
  <g transform="translate(130, 45)">
    <rect width="140" height="32" rx="16" fill="#14471D" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
    <circle cx="16" cy="16" r="8" fill="#55E072"/>
    <path d="M13 16 L15 18 L19 14" stroke="#14471D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="32" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">Adulto • Kids • PET</text>
  </g>
</svg>

