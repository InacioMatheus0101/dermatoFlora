<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo de estúdio suave -->
    <radialGradient id="psor-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F8F4"/>
      <stop offset="100%" stop-color="#E2EDE3"/>
    </radialGradient>
    
    <!-- Sombra de contato realista -->
    <radialGradient id="psor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20, 71, 29, 0.28)"/>
      <stop offset="60%" stop-color="rgba(20, 71, 29, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Gradiente do Pote -->
    <linearGradient id="jar-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#F7FAF7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#EBF3EB"/>
      <stop offset="100%" stop-color="#D9E6DA"/>
    </linearGradient>

    <!-- Tampa Verde Botânica -->
    <linearGradient id="jar-lid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14471D"/>
      <stop offset="25%" stop-color="#247833"/>
      <stop offset="50%" stop-color="#349645"/>
      <stop offset="75%" stop-color="#247833"/>
      <stop offset="100%" stop-color="#14471D"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="400" height="400" rx="24" fill="url(#psor-bg)"/>
  
  <!-- Ramo decorativo sutil de fundo -->
  <g opacity="0.12" transform="translate(240, 40) rotate(15)">
    <path d="M50 200 Q45 120 70 60 T80 0" stroke="#247833" stroke-width="3" fill="none"/>
    <path d="M48 150 C25 145 10 130 15 110 C35 115 48 130 48 150 Z" fill="#247833"/>
    <path d="M52 130 C72 120 88 125 90 105 C75 100 58 112 52 130 Z" fill="#247833"/>
    <path d="M58 90 C38 80 28 65 35 48 C50 55 58 72 58 90 Z" fill="#247833"/>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="200" cy="340" rx="120" ry="18" fill="url(#psor-shadow)"/>

  <!-- Corpo do Pote de Creme 100g -->
  <rect x="100" y="180" width="200" height="140" rx="18" fill="url(#jar-body)" stroke="#C8DBC9" stroke-width="1.5"/>

  <!-- Rótulo Frontal -->
  <rect x="115" y="195" width="170" height="110" rx="10" fill="#FFFFFF" stroke="#E2EDE3" stroke-width="1"/>
  
  <!-- Linha de destaque verde/laranja no topo do rótulo -->
  <rect x="115" y="195" width="85" height="4" fill="#247833" rx="2"/>
  <rect x="200" y="195" width="85" height="4" fill="#E2541C" rx="2"/>

  <!-- Logo DermatoFlora no Rótulo -->
  <g transform="translate(145, 206)">
    <circle cx="12" cy="12" r="10" fill="#247833"/>
    <path d="M12 2 A10 10 0 0 1 22 12 L12 12 Z" fill="#E2541C"/>
    <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
    <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#247833">Dermato<tspan fill="#E2541C">Flora</tspan></text>
    <text x="28" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" fill="#888" letter-spacing="1">FARMÁCIA DE MANIPULAÇÃO</text>
  </g>

  <!-- Nome do Produto no Rótulo -->
  <text x="200" y="246" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#14471D">CREME PARA PSORÍASE</text>
  <rect x="160" y="253" width="80" height="16" rx="8" fill="#E8F5E9"/>
  <text x="200" y="264" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#247833">PESO LÍQ. 100 g</text>
  
  <text x="200" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#666">Cuidado Dermatológico Especializado</text>
  <text x="200" y="293" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="500" fill="#888">+300 Pacientes Atendidos</text>

  <!-- Tampa do Pote com Ranhuras Elegantes -->
  <rect x="90" y="145" width="220" height="40" rx="8" fill="url(#jar-lid)"/>
  <!-- Reflexo de luz na tampa -->
  <rect x="95" y="150" width="210" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
  <line x1="90" y1="172" x2="310" y2="172" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

  <!-- Badge Flutuante "+300 Pacientes" -->
  <g transform="translate(250, 85)">
    <rect width="115" height="32" rx="16" fill="#14471D" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
    <circle cx="16" cy="16" r="8" fill="#55E072"/>
    <path d="M13 16 L15 18 L19 14" stroke="#14471D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="30" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">+300 Pacientes</text>
  </g>
</svg>

