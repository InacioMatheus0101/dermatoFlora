<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <!-- Folha Botânica Flutuante Laranja DermatoFlora -->
  <defs>
    <linearGradient id="leafGradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E66" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E2541C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B23C0E" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Corpo da Folha Orgânica -->
  <path d="M50 10 C80 35 90 85 50 130 C10 85 20 35 50 10 Z" fill="url(#leafGradOrange)" filter="url(#softGlowOrange)"/>
  
  <!-- Nervura Central Principal -->
  <path d="M50 12 Q50 70 50 132" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Nervuras Laterais Finas -->
  <path d="M50 40 Q65 48 72 58" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M50 40 Q35 48 28 58" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M50 65 Q68 74 74 86" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M50 65 Q32 74 26 86" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M50 90 Q65 98 70 108" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M50 90 Q35 98 30 108" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Hastezinha da base -->
  <path d="M50 130 Q52 136 56 140" stroke="#B23C0E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>

