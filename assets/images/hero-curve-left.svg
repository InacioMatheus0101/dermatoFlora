<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" preserveAspectRatio="none" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="curve-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287F36" />
      <stop offset="50%" stop-color="#1F682C" />
      <stop offset="100%" stop-color="#14471D" />
    </linearGradient>
    <filter id="curve-shadow" x="0%" y="0%" width="120%" height="100%">
      <feDropShadow dx="4" dy="0" stdDeviation="10" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Curva Orgânica Verde com Sombra Suave -->
  <path d="M 0 0 
           L 180 0 
           C 240 120, 360 220, 310 380 
           C 260 520, 150 620, 0 700 
           Z" 
        fill="url(#curve-green-grad)" 
        filter="url(#curve-shadow)" />
</svg>

