<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="100%" stop-color="#FFF8E1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tube-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDEDED" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F5F5F5" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="130" r="85" fill="url(#sun-glow)" />
  <g transform="translate(10, 10)">
    <!-- Cosmetic Tube -->
    <path d="M 68 35 L 132 35 L 126 160 C 124 175 116 185 100 185 C 84 185 76 175 74 160 Z" fill="url(#tube-grad)" stroke="#E0E0E0" stroke-width="1.2" />
    <!-- Tube top crimp -->
    <rect x="66" y="30" width="68" height="7" rx="1.5" fill="#CCCCCC" />
    <!-- Cap at bottom -->
    <rect x="80" y="185" width="40" height="24" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
    <!-- Label Details on tube -->
    <circle cx="100" cy="72" r="12" fill="#E2541C" />
    <!-- Sun icon -->
    <circle cx="100" cy="72" r="6" fill="#FFF9C4" />
    <text x="100" y="98" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#2E7D32" text-anchor="middle">PROTETOR SOLAR</text>
    <text x="100" y="110" font-family="sans-serif" font-size="7" font-weight="bold" fill="#E2541C" text-anchor="middle">FPS 60 TOQUE SECO</text>
    <rect x="78" y="120" width="44" height="1.5" fill="#E0E0E0" />
    <text x="100" y="132" font-family="sans-serif" font-size="5.5" fill="#616161" text-anchor="middle">Filtro Físico • Sem Óleo</text>
    <text x="100" y="142" font-family="sans-serif" font-size="5" fill="#9E9E9E" text-anchor="middle">Dermocosmético • 50g</text>
  </g>
</svg>

