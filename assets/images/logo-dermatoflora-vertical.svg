<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="v-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B38" />
      <stop offset="100%" stop-color="#1A6126" />
    </linearGradient>
    <linearGradient id="v-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E2541C" />
    </linearGradient>
    <filter id="v-soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- ==================== EMBLEMA CENTRAL (CÍRCULO + CÁPSULA + FOLHAS) ==================== -->
  <g transform="translate(105, 10)" filter="url(#v-soft-shadow)">
    <!-- Metade Superior Verde -->
    <path d="M 45 6 A 42 42 0 0 0 4 48 A 42 42 0 0 0 45 90 L 45 6 Z" fill="url(#v-green-grad)" transform="rotate(45 45 48)" />
    <!-- Metade Inferior Laranja -->
    <path d="M 45 6 A 42 42 0 0 1 86 48 A 42 42 0 0 1 45 90 L 45 6 Z" fill="url(#v-orange-grad)" transform="rotate(45 45 48)" />

    <!-- Cápsula Rotacionada em 40 Graus -->
    <g transform="rotate(-40 45 48)">
      <rect x="29" y="18" width="32" height="60" rx="16" fill="#FFFFFF" stroke="#FAF7F2" stroke-width="1.5" />
      <path d="M 29 35 C 29 25 36 18 45 18 C 54 18 61 25 61 35 L 61 48 L 29 48 Z" fill="#247833" />
      <line x1="29" y1="48" x2="61" y2="48" stroke="#ECE5DD" stroke-width="1.2" />
    </g>

    <!-- Folhas Brotam da Cápsula -->
    <!-- Folha 1 (Esquerda - Branca) -->
    <path d="M 37 50 C 23 44 21 30 35 25 C 41 34 40 44 37 50 Z" fill="#FFFFFF" stroke="#FAF7F2" stroke-width="1.2" />
    <!-- Folha 2 (Inferior Esquerda - Pequena Branca) -->
    <path d="M 36 53 C 23 55 22 67 34 68 C 38 62 38 55 36 53 Z" fill="#FFFFFF" stroke="#FAF7F2" stroke-width="1.2" />
    <!-- Folha 3 (Direita - Verde) -->
    <path d="M 41 48 C 59 40 67 30 58 22 C 48 30 45 42 41 48 Z" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.2" />
    <path d="M 41 48 Q 51 35 58 22" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- ==================== TIPOGRAFIA CENTRALIZADA ==================== -->
  <text x="150" y="160" text-anchor="middle" font-family="'Poppins', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="36" letter-spacing="-0.5">
    <tspan fill="#E2541C">Dermato</tspan><tspan fill="#247833">Flora</tspan>
  </text>

  <!-- Subtítulo Institucional "FARMÁCIA DE MANIPULAÇÃO" -->
  <text x="150" y="184" text-anchor="middle" font-family="'Poppins', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11.5" fill="#E2541C" letter-spacing="4">FARMÁCIA DE MANIPULAÇÃO</text>
</svg>

